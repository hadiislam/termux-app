name: Bengali Render Debug APK

on:
  push:
    branches:
      - bengali-render-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android 7+ Debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "1"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-bengali-render-arm64
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
